<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>暮刻 iPhone 鎖屏預覽</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0b0c0e;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", sans-serif;
    }
    .stage {
      width: 430px;
      height: 932px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 54px;
      background:
        radial-gradient(circle at 72% 18%, rgba(138,48,59,.36), transparent 33%),
        radial-gradient(circle at 16% 68%, rgba(73,89,108,.24), transparent 37%),
        linear-gradient(155deg, #252023 0%, #111214 48%, #050607 100%);
      box-shadow: 0 36px 90px rgba(0,0,0,.62), inset 0 0 90px rgba(255,255,255,.025);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: -20%;
      opacity: .17;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .island { position: absolute; top: 18px; left: 50%; width: 122px; height: 35px; transform: translateX(-50%); border-radius: 22px; background: #000; }
    .status { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 24px 29px 0; font-size: 15px; font-weight: 650; }
    .status .right { font-size: 12px; letter-spacing: 2px; }
    .clock { position: relative; margin-top: 73px; text-align: center; color: rgba(247,242,232,.96); }
    .date { font-size: 20px; font-weight: 560; letter-spacing: -.02em; }
    .time { margin-top: -4px; font-size: 102px; font-weight: 250; line-height: 1; letter-spacing: -7px; }
    .next {
      position: relative;
      width: 248px;
      margin: 25px auto 0;
      padding: 9px 12px;
      display: grid;
      grid-template-columns: 3px 1fr auto;
      gap: 9px;
      align-items: center;
      color: rgba(247,242,232,.94);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(7,8,10,.46);
      backdrop-filter: blur(18px);
    }
    .next .rail { height: 31px; border-radius: 3px; background: #5aa9ff; }
    .next small { display: block; color: rgba(247,242,232,.54); font-size: 9px; }
    .next strong { display: block; margin-top: 1px; font-size: 11px; }
    .next time { font-size: 11px; font-variant-numeric: tabular-nums; }
    .board {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 112px;
      min-height: 160px;
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      overflow: hidden;
      color: #f7f2e8;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 23px;
      background: rgba(7,8,10,.96);
      box-shadow: 0 22px 55px rgba(0,0,0,.52), inset 0 1px rgba(255,255,255,.045);
      backdrop-filter: blur(28px);
    }
    .divider { width: 1px; margin: 16px 0; background: rgba(255,255,255,.12); }
    .column { min-width: 0; padding: 16px 14px 13px; }
    .column header { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 11px; font-weight: 730; }
    .column header .count { margin-left: auto; font-size: 10px; color: #5aa9ff; }
    .column.todo header .count, .column.todo header .icon { color: #6ad69b; }
    .icon { color: #5aa9ff; }
    .row { display: grid; grid-template-columns: 3px 1fr; gap: 7px; margin: 7px 0; min-width: 0; }
    .row .rail { width: 3px; height: 29px; border-radius: 3px; background: var(--accent); }
    .row strong { display: block; overflow: hidden; color: #f7f2e8; font-size: 10px; font-weight: 650; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .row small { display: block; overflow: hidden; margin-top: 2px; color: rgba(247,242,232,.55); font-size: 8px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .more { margin: 4px 0 0 10px; color: rgba(247,242,232,.5); font-size: 8px; font-weight: 650; }
    .todo-line { display: grid; grid-template-columns: 15px 1fr; gap: 6px; align-items: start; margin: 10px 0; }
    .circle { width: 13px; height: 13px; margin-top: 1px; border: 1.5px solid rgba(247,242,232,.66); border-radius: 50%; }
    .todo-line strong { overflow: hidden; font-size: 10px; font-weight: 600; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .hint { position: absolute; right: 26px; bottom: 84px; color: rgba(247,242,232,.38); font-size: 9px; }
    .homebar { position: absolute; left: 50%; bottom: 9px; width: 140px; height: 5px; transform: translateX(-50%); border-radius: 4px; background: rgba(255,255,255,.92); }
    .quick { position: absolute; bottom: 36px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: rgba(7,8,10,.5); border: 1px solid rgba(255,255,255,.06); font-size: 19px; }
    .flash { left: 35px; }
    .camera { right: 35px; }
  </style>
</head>
<body>
  <main class="stage" aria-label="iPhone 鎖定畫面功能預覽">
    <div class="island"></div>
    <div class="status"><span>9:41</span><span class="right">●●● ᴡɪғɪ ▰</span></div>
    <section class="clock"><div class="date">9 月 2 日 星期三</div><div class="time">08:08</div></section>
    <section class="next">
      <span class="rail"></span>
      <div><small>下一項</small><strong>📐 線性代數 · A301</strong></div>
      <time>09:00</time>
    </section>
    <section class="board" aria-label="今日全部行程和待辦 Live Activity">
      <div class="column">
        <header><span class="icon">▥</span><span>行程</span><span class="count">4 項</span></header>
        <div class="row" style="--accent:#f6b44b"><span class="rail"></span><div><strong>📐 線性代數</strong><small>09:00–10:40 · A301</small></div></div>
        <div class="row" style="--accent:#5aa9ff"><span class="rail"></span><div><strong>🎓 教育心理學</strong><small>11:00–12:30 · B204</small></div></div>
        <div class="row" style="--accent:#ff6b81"><span class="rail"></span><div><strong>🥋 跆拳道訓練</strong><small>14:30–16:00 · 體育館</small></div></div>
        <div class="more">＋1 項公事</div>
      </div>
      <div class="divider"></div>
      <div class="column todo">
        <header><span class="icon">●</span><span>待辦</span><span class="count">0 / 2</span></header>
        <div class="todo-line"><span class="circle"></span><strong>完成統計學功課</strong></div>
        <div class="todo-line"><span class="circle"></span><strong>預習下星期課堂</strong></div>
      </div>
    </section>
    <span class="hint">鎖屏效果示意</span>
    <span class="quick flash">◉</span><span class="quick camera">▣</span>
    <span class="homebar"></span>
  </main>
</body>
</html>
